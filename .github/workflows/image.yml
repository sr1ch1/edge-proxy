# Build, test, and publish the edge-proxy image to GHCR.
#
#   pins  — every image reference in the Dockerfile (syntax frontend + FROM)
#           is re-resolved against its registry; a mutable tag that no longer
#           matches the pinned digest fails the pipeline before anything builds.
#   build — native amd64 build, loaded locally and exercised end-to-end by
#           scripts/smoke-test.sh (artifact contract, fail-closed startup,
#           ACME webroot, SNI routing, token-at-rest mode).
#   push  — multi-arch (amd64 + arm64, the two arches with pinned checksums in
#           the Dockerfile) push to ghcr.io. Runs only on pushes to main and
#           v*.*.* tags; PRs and dispatch builds are tested but never pushed.
#
# All actions are pinned by commit SHA — the same mutable-tag policy the
# Dockerfile applies to base images. To bump: resolve the new tag's commit
# (git ls-remote), update SHA + comment in one reviewed change.
name: image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# Deny-by-default; each job re-grants only what it needs (push: packages:write).
permissions: {}

concurrency:
  group: image-${{ github.ref }}
  # Serial per ref, deliberately NOT cancel-in-progress: a push to main killed
  # mid-publish leaves a tag whose arch manifest is incomplete or unsigned.
  # A short queue is cheaper than a broken published artifact.
  cancel-in-progress: false

jobs:
  pins:
    name: tag/digest drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-image-pins.sh

  build:
    name: build + smoke test
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Helper-level regression tests (install_cert/issue) — these paths are
      # unreachable from smoke-test.sh, which blackholes ACME.
      - name: entrypoint unit tests
        run: scripts/test-entrypoint.sh entrypoint.sh

      # Single-arch + load: the smoke test runs the actual image locally.
      # cache-to (mode=max) makes the multi-arch push job below a cache hit.
      - name: build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: edge-proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: scripts/smoke-test.sh edge-proxy:test

  push:
    name: push multi-arch to ghcr.io
    needs: build
    # push events only — main branch and v*.*.* tags (see `on:`). PRs and
    # manual dispatches stop at the tested image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign: OIDC token → short-lived Fulcio cert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires lowercase image names; repository names may not be.
      # The expression goes through env: (never interpolated into the script
      # text) — the standard GitHub pattern that keeps any future expansion of
      # the expression grammar out of the shell's parser.
      - name: lowercase image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: build + push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # cosign-release is a mutable tag — the one unpinned input in this
      # pipeline, resolving a binary that then runs with packages:write +
      # id-token:write. Verify the installed binary against the sha256 from the
      # release's cosign_checksums.txt, pinned here as a literal — same policy
      # as the frps/lego checksums in the Dockerfile. To bump: download the new
      # release's checksums file, verify out-of-band, update the literal.
      - name: verify cosign binary (sha256-pinned)
        run: |
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $(command -v cosign)" | sha256sum -c

      # Keyless signing: the job OIDC token is exchanged for a short-lived
      # Fulcio certificate; the signature and the Rekor transparency-log entry
      # are stored next to the image in ghcr.io. Sign the manifest-list digest
      # (covers both arches), never a tag — tags are mutable.
      # Consumers verify with:
      #   cosign verify ghcr.io/<owner>/<repo>@sha256:<digest> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp \
      #       '^https://github\.com/<owner>/<repo>/\.github/workflows/image\.yml@'
      - name: sign image (keyless)
        run: cosign sign --yes "ghcr.io/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
