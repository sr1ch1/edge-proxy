# Alpine ships `stream` as a dynamic module; load it by absolute path — no
# include-glob, so nothing beyond this file can introduce config or modules.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes 1;
pid /tmp/nginx/nginx.pid;   # /tmp is tmpfs at run time (--tmpfs /tmp) — /run is not writable
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    server_tokens off;

    # Incident forensics on the only unauthenticated HTTP surface (:80; :443 is
    # TLS passthrough — no HTTP context to log). /dev/stderr under the compose
    # json-file driver (max-size/max-file) — bounded, so probe noise can't fill
    # the host disk. Attacker-controlled values ($request, $http_host) are
    # escaped by default (\xXX for control bytes), blocking log injection.
    log_format edge '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_host"';
    access_log /dev/stderr edge;

    # Rate-limit the ACME path: unknown challenges relay into the sidecar with
    # attacker-controlled Host — cap the amplification without throttling any
    # legit issuance (LE makes one request per challenge name; multi-perspective
    # validation is a handful of IPs, one hit each). limit_req lives in the
    # ACME location only, so a try_files redirect to @relay is counted once.
    limit_req_zone $binary_remote_addr zone=acme:10m rate=20r/s;
    # Throttle token-guess attempts on the wss terminator: frps token auth has
    # no attempt limit of its own, so without this :443 with any t-* SNI is a
    # line-rate brute-force oracle for the token. limit_req is an HTTP-phase
    # directive — it runs only AFTER TLS termination and request parsing, so it
    # does NOT throttle TLS handshakes; handshake CPU and pre-request connection
    # cost is bounded by limit_conn on the stream server below. A legit sidecar
    # holds ONE long-lived tunnel connection and reconnects rarely, so a low
    # rate with a modest burst costs it nothing. limit_req applies per handshake
    # request; the established tunnel itself is unaffected.
    limit_req_zone $binary_remote_addr zone=tunnel:10m rate=10r/s;
    limit_req_status 429;

    # Bound per-IP connections on :80 as well: limit_req throttles request
    # RATES after request parsing, but slow/pre-request connections are
    # otherwise unbounded and share the 1024 worker_connections with the
    # stream block — :80 could be used to starve the :443 SNI path. Same
    # per-IP budget as the stream zone (edgeconn) below: the sidecar never
    # needs more than a handful of concurrent challenge requests.
    limit_conn_zone $binary_remote_addr zone=httpconn:10m;

    # :80 — ACME challenges ONLY. t-* tokens are local (lego webroot);
    # all other challenges relay through the tunnel to the sidecar's ACME responder.
    server {
        listen 80;
        limit_conn httpconn 20;
        location /.well-known/acme-challenge/ {
            limit_req zone=acme burst=50 nodelay;
            root /var/www/acme;
            try_files $uri @relay;
        }
        location @relay {
            proxy_pass http://127.0.0.1:8080;      # frps 'acme' proxy → sidecar
            proxy_set_header Host $host;
            # Forensics for the sidecar's ACME responder (relayed requests
            # otherwise all appear from the loopback tunnel peer). Overwrite —
            # never append to — any client-supplied X-Forwarded-For: the edge
            # is the trusted first hop, so $remote_addr is the verified peer.
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / { return 404; }
    }

    # wss terminator for the tunnel control channel (reachable ONLY via the
    # gated t-* route in the stream map below). Placeholder cert allows nginx to
    # start; entrypoint swaps in the LE cert and reloads — and until that swap
    # succeeds the gate keeps this block unreachable from :443.
    server {
        listen 127.0.0.1:7444 ssl;
        server_name _;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers governs TLSv1.2 only (1.3 suites are not configurable);
        # covers RSA (placeholder + LE default key) and ECDSA (if --key-type is
        # ever switched). No ssl_stapling: Let's Encrypt wound down OCSP in
        # 2025 in favor of CRLs.
        ssl_ciphers         'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        ssl_certificate     /certs/t.crt;
        ssl_certificate_key /certs/t.key;
        location / {
            limit_req zone=tunnel burst=30;
            proxy_pass http://127.0.0.1:7000;      # frps control (plain ws behind this TLS)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

stream {
    # Who probed :443 and with what SNI — the TLS layer's only audit trail
    # (no HTTP context exists here to log). Same bounded /dev/stderr +
    # compose log driver as the http block above.
    log_format edge '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                    'status=$status bytes=$bytes_sent';
    access_log /dev/stderr edge;

    # Bound per-IP connections on the multiplexed port: limit_req (http block)
    # throttles token-guess requests but runs after TLS termination, so without
    # this an attacker can exhaust worker_connections (1024) with pre-ClientHello
    # or handshake-churn connections and deny :443 to the legit sidecar. The
    # sidecar holds 1-2 long-lived connections; 20 leaves ample headroom behind
    # NAT. (limit_conn lives in ngx_stream_module.so, same module as this map.)
    limit_conn_zone $binary_remote_addr zone=edgeconn:10m;

    # :443 — TLS passthrough only; SNI selects the channel.
    # The wss control entry is not static: it is GATED on a CA-signed
    # certificate, so its body lives in an include the entrypoint rewrites
    # (/tmp/nginx/tunnel-route.conf — open: the terminator at :7444; closed: a
    # dead port, connection refused). The key is the exact DOMAIN (anchored,
    # case-insensitive) — not a t-* prefix — so a customer app hostname that
    # itself starts with t- still falls through to the passthrough below.
    # The placeholder cert therefore never reaches a TLS client — before first
    # issuance the sidecar gets a refused connection instead of a self-signed
    # cert to TOFU (see entrypoint.sh).
    # The include is required: a missing file fails the config load, and
    # entrypoint.sh always writes it before starting nginx.
    map $ssl_preread_server_name $upstream {
        include /tmp/nginx/tunnel-route.conf;
        default   127.0.0.1:7443;   # app passthrough (frps remotePort → sidecar TLS listener)
    }
    server {
        listen 443;
        limit_conn edgeconn 20;
        ssl_preread on;
        # proxy_timeout defaults to 10m: idle-but-alive app connections (DB
        # sessions, subscribe-only MQTT, quiet websockets) through the
        # passthrough would be silently severed. Match the control channel's 1h.
        proxy_timeout 1h;
        proxy_pass $upstream;
    }
}
